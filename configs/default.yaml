data:
  raw_path: "data/raw/dataset.csv"
  processed_dir: "data/processed"
  test_size: 0.15
  val_size: 0.15
  random_state: 42

  drop_columns:
    - id
    - spkid
    - full_name
    - pdes
    - name
    - prefix
    - orbit_id
    - equinox
    - epoch
    - epoch_cal
    - tp_cal
    - q
    - ad
    - "n"
    - per
    - per_y
    - moid_ld
    - diameter_sigma
    - albedo

  rare_classes:
    - HYA
    - IEO
    - AST
    - CEN


artifacts:
  model_path: "models/mtl_model.pt"
  scaler_path: "data/processed/scaler.joblib"
  label_encoder_path: "data/processed/label_encoder.joblib"
  class_albedo_prior_path: "data/processed/class_albedo_prior.joblib"
  train_parquet_path: "data/processed/train.parquet"
  raw_dataset_path: "data/raw/dataset.csv"
  presets_path: "data/processed/presets.joblib"

model:
  backbone_layers: [512, 256, 128, 64]
  head_hidden: 32
  dropout_shared: [0.3, 0.3, 0.2, 0.2]
  dropout_head: 0.1
  n_classes: 10

training:
  batch_size: 1024
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  patience: 10
  max_grad_norm: 1.0
  scheduler: cosine
  min_lr: 0.00001
